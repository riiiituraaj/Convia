version: '3.8'

services:
  db:
    image: pgvector/pgvector:pg16
    container_name: convia-postgres
    restart: always
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: password
      POSTGRES_DB: convia
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data

  redis:
    image: redis:7-alpine
    container_name: convia-redis
    restart: always
    ports:
      - "6379:6379"

  api:
    build:
      context: ./services/api
      dockerfile: Dockerfile
    container_name: convia-api
    restart: always
    environment:
      - DATABASE_URL=postgresql+asyncpg://postgres:password@db:5432/convia
      - REDIS_URL=redis://redis:6379/0
      - NEBIUS_API_KEY=${NEBIUS_API_KEY}
      - TAVILY_API_KEY=${TAVILY_API_KEY}
      - NVIDIA_API_KEY=${NVIDIA_API_KEY}
      - AUTH_SECRET=${AUTH_SECRET}
    ports:
      - "8000:8000"
    depends_on:
      - db
      - redis

  web:
    build:
      context: ./apps/web
      dockerfile: Dockerfile
    container_name: convia-web
    restart: always
    ports:
      - "3000:3000"
    environment:
      - NEXT_PUBLIC_API_URL=http://localhost:8000/api
    depends_on:
      - api

volumes:
  pgdata:

